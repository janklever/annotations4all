<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font: 12px/1.45 Inter, system-ui, sans-serif;
      color: var(--figma-color-text, #1e1e1e);
      background: var(--figma-color-bg, #fff);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .app-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--figma-color-text-secondary, #6b6b6b);
      text-transform: uppercase;
    }

    .lang-switch {
      display: inline-flex;
      background: var(--figma-color-bg-secondary, #f5f5f5);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .lang-btn {
      font: inherit;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 7px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--figma-color-text-secondary, #6b6b6b);
      cursor: pointer;
      line-height: 1.2;
      transition: background 0.15s, color 0.15s;
    }

    .lang-btn:hover {
      color: var(--figma-color-text, #1e1e1e);
    }

    .lang-btn.active {
      background: var(--figma-color-bg, #fff);
      color: var(--figma-color-text, #1e1e1e);
      box-shadow: 0 0 0 1px var(--figma-color-border, #e6e6e6);
      font-weight: 600;
    }

    h1 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 4px;
    }

    .lead {
      margin: 0 0 16px;
      color: var(--figma-color-text-secondary, #6b6b6b);
    }

    fieldset {
      border: 0;
      padding: 0;
      margin: 0 0 14px;
    }

    legend {
      font-weight: 600;
      padding: 0;
      margin-bottom: 6px;
    }

    .seg {
      display: flex;
      gap: 2px;
      padding: 2px;
      border-radius: 6px;
      background: var(--figma-color-bg-secondary, #f5f5f5);
    }

    .seg label {
      flex: 1;
      text-align: center;
      padding: 5px 0;
      border-radius: 4px;
      cursor: pointer;
      color: var(--figma-color-text-secondary, #6b6b6b);
    }

    .seg input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .seg label:has(input:checked) {
      background: var(--figma-color-bg, #fff);
      color: var(--figma-color-text, #1e1e1e);
      box-shadow: 0 0 0 1px var(--figma-color-border, #e6e6e6);
      font-weight: 500;
    }

    .seg label:has(input:focus-visible) {
      outline: 2px solid var(--figma-color-border-selected, #0d99ff);
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      cursor: pointer;
    }

    .hint {
      margin: 2px 0 0 21px;
      font-size: 11px;
      color: var(--figma-color-text-secondary, #6b6b6b);
    }

    .check input {
      margin: 0;
      accent-color: var(--figma-color-bg-brand, #0d99ff);
    }

    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .field input {
      width: 80px;
      padding: 5px 8px;
      border-radius: 4px;
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid var(--figma-color-border, #e6e6e6);
    }

    .field input:focus {
      outline: none;
      border-color: var(--figma-color-border-selected, #0d99ff);
    }

    .status {
      margin: 4px 0 12px;
      padding: 8px 10px;
      border-radius: 6px;
      min-height: 34px;
      background: var(--figma-color-bg-secondary, #f5f5f5);
    }

    .status.ok {
      background: var(--figma-color-bg-success-tertiary, #e8f7ee);
    }

    .status.error {
      background: var(--figma-color-bg-danger-tertiary, #fdecec);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      font: inherit;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    button:focus-visible {
      outline: 2px solid var(--figma-color-border-selected, #0d99ff);
      outline-offset: 1px;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .primary {
      background: var(--figma-color-bg-brand, #0d99ff);
      color: var(--figma-color-text-onbrand, #fff);
    }

    .secondary {
      background: transparent;
      color: var(--figma-color-text, #1e1e1e);
      border-color: var(--figma-color-border, #e6e6e6);
    }
  </style>
</head>

<body>
  <div class="top-bar">
    <span class="app-title" data-i18n="appTitle">Annotations for all</span>
    <div class="lang-switch" role="group" aria-label="Idioma / Language">
      <button type="button" id="btn-lang-pt" class="lang-btn" data-lang="pt" title="Português">PT</button>
      <button type="button" id="btn-lang-en" class="lang-btn" data-lang="en" title="English">EN</button>
    </div>
  </div>

  <form id="form">
    <fieldset>
      <legend data-i18n="scopeLegend">Onde procurar</legend>
      <div class="seg">
        <label><input type="radio" name="scope" value="page" checked><span data-i18n="scopePage">Página atual</span></label>
        <label><input type="radio" name="scope" value="selection"><span data-i18n="scopeSelection">Seleção</span></label>
      </div>
    </fieldset>

    <div id="status" class="status" role="status" aria-live="polite" data-i18n="statusSearching">Procurando annotations...</div>

    <fieldset>
      <legend data-i18n="sideLegend">Posição dos cards</legend>
      <div class="seg">
        <label><input type="radio" name="side" value="auto" checked><span data-i18n="sideAuto">Mais próximo</span></label>
        <label><input type="radio" name="side" value="left"><span data-i18n="sideLeft">Esquerda</span></label>
        <label><input type="radio" name="side" value="right"><span data-i18n="sideRight">Direita</span></label>
      </div>
    </fieldset>

    <fieldset>
      <div class="field">
        <label for="cardWidth" data-i18n="cardWidthLabel">Largura do card (px)</label>
        <input id="cardWidth" name="cardWidth" type="number" min="240" max="640" step="20" value="320">
      </div>
    </fieldset>

    <fieldset>
      <legend data-i18n="themeLegend">Tema dos cards</legend>
      <div class="seg">
        <label><input type="radio" name="theme" value="auto" checked><span data-i18n="themeAuto">Automático</span></label>
        <label><input type="radio" name="theme" value="light"><span data-i18n="themeLight">Claro</span></label>
        <label><input type="radio" name="theme" value="dark"><span data-i18n="themeDark">Escuro</span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend data-i18n="showLegend">Mostrar</legend>
      <label class="check"><input type="checkbox" name="showProps" checked> <span data-i18n="showProps">Propriedades (medidas, cores, tokens)</span></label>
      <label class="check"><input type="checkbox" name="highlight" checked> <span data-i18n="highlight">Destaque nos elementos</span></label>
      <label class="check"><input type="checkbox" name="lines" checked> <span data-i18n="lines">Linhas até os cards</span></label>
      <label class="check"><input type="checkbox" name="lock" checked> <span data-i18n="lock">Travar camadas geradas</span></label>
    </fieldset>

    <div class="actions">
      <button id="generate" class="primary" type="submit" data-i18n="btnGenerate">Gerar ou atualizar</button>
      <button id="clear" class="secondary" type="button" data-i18n="btnClear">Remover camadas geradas</button>
    </div>
  </form>

  <script>
    const I18N = {
      pt: {
        appTitle: 'Annotations for all',
        scopeLegend: 'Onde procurar',
        scopePage: 'Página atual',
        scopeSelection: 'Seleção',
        statusSearching: 'Procurando annotations...',
        statusGenerating: 'Gerando...',
        statusEmptySelection: 'Nenhuma annotation na seleção. Selecione telas ou elementos anotados.',
        statusEmptyPage: 'Nenhuma annotation nesta página.',
        statusCount: (ann, nodes) => ann + (ann === 1 ? ' annotation' : ' annotations') + ' em ' + nodes + (nodes === 1 ? ' elemento.' : ' elementos.'),
        statusErrorPrefix: 'Não deu certo: ',
        sideLegend: 'Posição dos cards',
        sideAuto: 'Mais próximo',
        sideLeft: 'Esquerda',
        sideRight: 'Direita',
        cardWidthLabel: 'Largura do card (px)',
        themeLegend: 'Tema dos cards',
        themeAuto: 'Automático',
        themeLight: 'Claro',
        themeDark: 'Escuro',
        showLegend: 'Mostrar',
        showProps: 'Propriedades (medidas, cores, tokens)',
        highlight: 'Destaque nos elementos',
        lines: 'Linhas até os cards',
        lock: 'Travar camadas geradas',
        btnGenerate: 'Gerar ou atualizar',
        btnClear: 'Remover camadas geradas'
      },
      en: {
        appTitle: 'Annotations for all',
        scopeLegend: 'Where to look',
        scopePage: 'Current page',
        scopeSelection: 'Selection',
        statusSearching: 'Looking for annotations...',
        statusGenerating: 'Generating...',
        statusEmptySelection: 'No annotations in selection. Select frames or annotated elements.',
        statusEmptyPage: 'No annotations on this page.',
        statusCount: (ann, nodes) => ann + (ann === 1 ? ' annotation' : ' annotations') + ' across ' + nodes + (nodes === 1 ? ' element.' : ' elements.'),
        statusErrorPrefix: 'Something went wrong: ',
        sideLegend: 'Card position',
        sideAuto: 'Closest',
        sideLeft: 'Left',
        sideRight: 'Right',
        cardWidthLabel: 'Card width (px)',
        themeLegend: 'Card theme',
        themeAuto: 'Auto',
        themeLight: 'Light',
        themeDark: 'Dark',
        showLegend: 'Show',
        showProps: 'Properties (dimensions, colors, tokens)',
        highlight: 'Highlight on elements',
        lines: 'Connector lines to cards',
        lock: 'Lock generated layers',
        btnGenerate: 'Generate or update',
        btnClear: 'Remove generated layers'
      }
    };

    const form = document.getElementById('form');
    const status = document.getElementById('status');
    const btnGenerate = document.getElementById('generate');
    const btnClear = document.getElementById('clear');
    let lastCount = 0;
    let lastCountMsg = null;

    const send = (msg) => parent.postMessage({ pluginMessage: msg }, '*');

    function detectFigmaLang() {
      const navLang = (navigator.language || (navigator.languages && navigator.languages[0]) || '').toLowerCase();
      return navLang.startsWith('pt') ? 'pt' : 'en';
    }

    let currentLang = detectFigmaLang();

    function setLanguage(lang, manualChange) {
      currentLang = (lang === 'en' ? 'en' : 'pt');
      document.documentElement.lang = currentLang === 'pt' ? 'pt-BR' : 'en';
      const t = I18N[currentLang];

      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });

      document.querySelectorAll('.lang-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang);
      });

      if (lastCountMsg) {
        updateStatusFromCount();
      } else if (status.classList.contains('ok') === false && status.classList.contains('error') === false) {
        setStatus(t.statusSearching);
      }

      if (manualChange) {
        send({ type: 'set-lang', lang: currentLang });
      }
    }

    function updateStatusFromCount() {
      if (!lastCountMsg) return;
      const t = I18N[currentLang];
      if (lastCountMsg.annotations === 0) {
        setStatus(lastCountMsg.scope === 'selection' ? t.statusEmptySelection : t.statusEmptyPage);
      } else {
        setStatus(t.statusCount(lastCountMsg.annotations, lastCountMsg.nodes));
      }
    }

    function read() {
      const w = Number(form.cardWidth ? form.cardWidth.value : 320) || 320;
      return {
        scope: form.scope ? form.scope.value : 'page',
        side: form.side ? form.side.value : 'auto',
        theme: form.theme ? form.theme.value : 'auto',
        cardWidth: Math.min(640, Math.max(240, w)),
        showProps: form.showProps ? form.showProps.checked : true,
        highlight: form.highlight ? form.highlight.checked : true,
        lines: form.lines ? form.lines.checked : true,
        lock: form.lock ? form.lock.checked : true,
        live: form.live ? form.live.checked : true,
        lang: currentLang
      };
    }

    function write(o) {
      if (!o) return;
      if (o.lang && (o.lang === 'pt' || o.lang === 'en')) {
        setLanguage(o.lang, false);
      }
      if (form.scope) form.scope.value = o.scope;
      if (form.side) form.side.value = o.side;
      if (form.theme) form.theme.value = o.theme;
      if (form.cardWidth) form.cardWidth.value = o.cardWidth;
      if (form.showProps) form.showProps.checked = !!o.showProps;
      if (form.highlight) form.highlight.checked = !!o.highlight;
      if (form.lines) form.lines.checked = !!o.lines;
      if (form.lock) form.lock.checked = !!o.lock;
      if (form.live) form.live.checked = o.live !== false;
    }

    function setStatus(text, kind) {
      status.textContent = text;
      status.className = 'status' + (kind ? ' ' + kind : '');
    }

    function busy(on) {
      btnGenerate.disabled = on || lastCount === 0;
      btnClear.disabled = on;
    }

    // Inicializa o idioma detectado do Figma e notifica o plugin
    setLanguage(currentLang, false);
    send({ type: 'set-lang', lang: currentLang });

    document.querySelectorAll('.lang-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        setLanguage(btn.dataset.lang, true);
      });
    });

    form.addEventListener('change', (e) => {
      if (e.target.name === 'scope' && form.scope) send({ type: 'count', scope: form.scope.value });
      if (e.target.name === 'live' && form.live) send({ type: 'live', on: form.live.checked });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      busy(true);
      setStatus(I18N[currentLang].statusGenerating);
      send({ type: 'generate', options: read() });
    });

    btnClear.addEventListener('click', () => {
      busy(true);
      send({ type: 'clear' });
    });

    onmessage = (e) => {
      const m = e.data.pluginMessage;
      if (!m) return;
      if (m.type === 'init') {
        write(m.options);
      } else if (m.type === 'count') {
        lastCount = m.annotations;
        lastCountMsg = m;
        updateStatusFromCount();
        busy(false);
      } else if (m.type === 'done') {
        lastCountMsg = null;
        setStatus(m.text, 'ok');
        busy(false);
      } else if (m.type === 'error') {
        lastCountMsg = null;
        const prefix = I18N[currentLang].statusErrorPrefix;
        setStatus(prefix + m.text, 'error');
        busy(false);
      }
    };
  </script>
</body>

</html>
